name: Resolve product-sum dependency locks
on:
  push:
    branches: [astra/product-sum-locks-20261113]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: |
          cargo update --workspace
          cargo update --workspace --manifest-path fuzz/Cargo.toml
          cargo update --workspace --manifest-path profile/akita-recursion/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-sum-locks
          path: |
            Cargo.lock
            fuzz/Cargo.lock
            profile/akita-recursion/Cargo.lock
